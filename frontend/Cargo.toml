[package]
name = "winnie-cam-frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared-types = { path = "../shared-types" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlCanvasElement",
  "HtmlDivElement",
  "CanvasRenderingContext2d",
  "EventSource",
  "EventSourceInit",
  "ResizeObserver",
  "ResizeObserverEntry",
  "AudioContext",
  "AudioContextState",
  "OscillatorNode",
  "OscillatorType",
  "GainNode",
  "AudioDestinationNode",
  "AudioParam",
  "VisibilityState",
  "DomRect",
  "DomRectReadOnly",
  "Performance",
  "Storage",
  "CssStyleDeclaration",
] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"