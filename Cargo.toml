[package]
name = "winnie-cam"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["shared-types", "frontend"]

[dependencies]
shared-types = { path = "shared-types" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "signal", "time"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
futures = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
v4l = "0.14"
tract-onnx = "0.22"
zune-jpeg = "0.5"

[dev-dependencies]
# `test-util` gives the audio supervisor tests a paused clock, so the 5s
# linger window doesn't have to be waited out for real.
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "winnie-cam"
path = "src/main.rs"
